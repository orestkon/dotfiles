[mgr]
ratio = [2, 3, 6]

[opener]
edit = [
    { run = '${EDITOR} "%s"', desc = "Edit", block = true, for = "unix" },
]

[open]
rules = [
    { url = "*/", use = [ "edit", "open" ] },
    # Match hidden dotfiles (e.g. .config, .zshrc, .env)
    { url = ".*", use = [ "edit", "reveal" ] },
    # Match common extensionless or special config files
    { url = "config", use = [ "edit", "reveal" ] },
    { url = "*.jsonc", use = [ "edit", "reveal" ] },
    { url = ".env*", use = [ "edit", "reveal" ] },
    { url = "*.lock", use = [ "edit", "reveal" ] },
    { url = "*.lockb", use = [ "edit", "reveal" ] },
    { mime = "text/*", use = [ "edit", "reveal" ] },
    { mime = "*", use = [ "open", "reveal" ] },
]

[preview]
image_preview_method = "kitty"
