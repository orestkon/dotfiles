[mgr]
ratio = [2, 3, 6]

[opener]
edit = [
    { run = '${EDITOR} "%s"', desc = "Edit", block = true, for = "unix" },
]

[open]
rules = [
    { url = "*/", use = [ "edit", "open" ] },
    { mime = "text/*", use = [ "edit", "reveal" ] },
    { mime = "*", use = [ "open", "reveal" ] },
]

[preview]
image_preview_method = "kitty"
