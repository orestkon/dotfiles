# =============================================
# 1. MODULAR IMPORTS
# =============================================
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/catppuccin.conf

# =============================================
# 2. CORE SETTINGS
# =============================================
set-option -g default-terminal 'tmux-256color'
set -g default-command "${SHELL}"

set -g prefix C-a
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g mouse on                  # use mouse to resize panes
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g focus-events on           # forward focus events to apps (nvim autoread)
set -g history-limit 100000      # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi

# =============================================
# 3. PLUGINS (TPM)
# =============================================
set -g @plugin 'tmux-plugins/tpm'

run '~/.config/tmux/plugins/tpm/tpm'

# =============================================
# 4. UI OVERRIDES
# =============================================
set -g status-style bg=default
set -g pane-active-border-style 'fg=green,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
